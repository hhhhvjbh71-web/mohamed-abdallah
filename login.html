<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | دكتور محمد عبد الله - عميد الفيزياء</title>
  <meta name="description"
    content="تسجيل الدخول إلى حسابك في منصة دكتور محمد عبد الله - عميد الفيزياء لمتابعة دروسك وامتحاناتك.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'><circle cx='12' cy='12' r='3'/><path d='M20.2 20.2c2.4-2.4 2.4-6.3 0-8.7L13 4.3a1.5 1.5 0 0 0-2.1 0L3.8 11.5c-2.4 2.4-2.4 6.3 0 8.7 2.4 2.4 6.3 2.4 8.7 0l7.7-7.7'/></svg>">
</head>

<body class="auth-page">

  <!-- خلفية الجسيمات التفاعلية -->
  <canvas id="physicsCanvas" class="physics-bg-canvas"></canvas>

  <!-- شريط ملاحة بسيط -->
  <header class="main-header" style="background: transparent; border-bottom: 1px solid var(--border-color);">
    <div class="container">
      <nav class="navbar" style="height: 70px;">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon physics-magnet-logo" style="width: 44px; height: 44px;">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M14 12 C14 2, 34 2, 34 12" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" opacity="0.8"></path>
              <path d="M8 24 C8 35 15 42 24 42 C33 42 40 35 40 24 V15 H30 V24 C30 27.5 27.5 31 24 31 C20.5 31 18 27.5 18 24 V15 H8 V24 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
              <rect x="8" y="10" width="10" height="9" rx="1.5" fill="#ef4444"/>
              <text x="13" y="17" fill="#ffffff" font-size="8" font-weight="900" text-anchor="middle" font-family="sans-serif">N</text>
              <rect x="30" y="10" width="10" height="9" rx="1.5" fill="#0284c7"/>
              <text x="35" y="17" fill="#ffffff" font-size="8" font-weight="900" text-anchor="middle" font-family="sans-serif">S</text>
              <path d="M23 7 L25 12 L22 13 L26 19 L24 14 L27 13 Z" fill="#fbbf24"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-title" style="font-size: 1.05rem;">دكتور محمد عبد الله</span>
            <span class="brand-subtitle" style="font-size: 0.75rem;">عميد الفيزياء ⚡🧲</span>
          </div>
        </a>

        <div style="display: flex; align-items: center; gap: 10px;">
          <!-- زر التبديل بين الوضع الليلي والنهاري -->
          <button type="button" class="theme-toggle-btn" aria-label="تبديل الثيم" title="تبديل الثيم">
            <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <a href="index.html" class="btn btn-outline btn-sm">الرئيسية</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- بطاقة تسجيل الدخول -->
  <main class="auth-main">
    <div class="auth-card auth-card-compact">

      <div class="auth-header">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
        </div>
        <h1>تسجيل الدخول</h1>
        <p>مرحباً بك مجدداً في منصة دكتور محمد عبد الله</p>
      </div>

      <form id="loginForm" class="auth-form" novalidate>

        <!-- رقم الهاتف أو اسم المستخدم -->
        <div class="form-group">
          <label for="loginPhone" class="form-label">
            <span>رقم الهاتف أو اسم المستخدم</span>
            <span class="required-star">*</span>
          </label>
          <div class="input-wrapper">
            <input type="text" id="loginPhone" class="form-input" placeholder="01xxxxxxxxx أو admin" maxlength="20"
              required autocomplete="username">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                  d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                </path>
              </svg>
            </span>
          </div>
          <span class="field-hint">رقم هاتفك المسجل أو admin للدخول للإدارة.</span>
        </div>

        <!-- كلمة المرور (6 أرقام) -->
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label for="loginPassword" class="form-label">
              <span>كلمة المرور (6 أرقام)</span>
              <span class="required-star">*</span>
            </label>
            <a href="#"
              onclick="alert('يرجى التواصل مع الدعم الفني أو السكرتارية لاستعادة كلمة المرور عبر واتساب'); return false;"
              style="font-size: 0.8rem; color: var(--accent-secondary); text-decoration: none;">نسيت كلمة المرور؟</a>
          </div>
          <div class="input-wrapper">
            <input type="password" id="loginPassword" class="form-input numeric-password"
              placeholder="الـ 6 أرقام الخاصة بحسابك" maxlength="6" inputmode="numeric" required
              autocomplete="current-password">
            <button type="button" class="password-toggle-btn" data-target="loginPassword"
              aria-label="إظهار أو إخفاء كلمة المرور">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- خيار تذكرني -->
        <div style="display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--text-secondary);">
          <input type="checkbox" id="rememberMe" checked
            style="accent-color: var(--accent-secondary); width: 16px; height: 16px; cursor: pointer;">
          <label for="rememberMe" style="cursor: pointer;">تذكر بيانات الدخول على هذا الجهاز</label>
        </div>

        <!-- زر تسجيل الدخول -->
        <button type="submit" class="btn btn-primary" id="btnSubmitLogin"
          style="width: 100%; padding: 13px; font-size: 1.05rem; margin-top: 6px;">
          <span>تسجيل الدخول</span>
        </button>

        <!-- حساب تجريبي سريع للاختبار -->
        <div
          style="background: rgba(56, 189, 248, 0.08); border: 1px dashed var(--border-color); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 0.82rem; color: var(--text-secondary); text-align: center;">
          💡 <strong>حساب تجريبي متاح فوراً:</strong> الهاتف: <code
            style="color: var(--accent-secondary);">01012345678</code> | الرمز: <code
            style="color: var(--accent-secondary);">123456</code>
        </div>

        <div class="form-footer-action">
          ليس لديك حساب بعد؟ <a href="register.html">أنشئ حسابك الآن مجاناً</a>
        </div>

      </form>

    </div>
  </main>

  <!-- Firebase SDK (Compat v9) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-service.js"></script>
  <script src="main.js"></script>
  <script src="auth.js"></script>
</body>

</html>
